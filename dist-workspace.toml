[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# Keep release creation's write permission scoped to the announce job below.
allow-dirty = ["ci"]
# CI backends to support
ci = "github"
# Publish crates before cargo-dist announces the GitHub Release.
github-release = "announce"
# Use a reusable workflow for crates.io Trusted Publishing.
publish-jobs = ["./publish-crates"]
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[dist.github-custom-job-permissions]
publish-crates = { contents = "read", "id-token" = "write" }

[dist.github-custom-runners]
global = "ubuntu-24.04"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-24.04"
