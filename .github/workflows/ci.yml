name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    name: Nix (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix flake check --all-systems --no-build
      - run: nix develop --command cargo fmt --all -- --check
      - run: nix build --no-link .#dirule
      - run: nix run .#dirule -- --version
      - run: nix run .#dirule -- check --color never

  msrv:
    name: Verify (Rust 1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-cargo-${{ hashFiles('**/Cargo.lock') }}

      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo run -p dirule -- check --color never
      - name: Verify Cargo installation (Unix)
        if: runner.os != 'Windows'
        run: |
          install_root="$RUNNER_TEMP/dirule-install"
          project_root="$RUNNER_TEMP/dirule-project"
          cargo install --path crates/dirule --locked --offline --root "$install_root"
          mkdir -p "$project_root"
          cd "$project_root"
          "$install_root/bin/dirule" init
          "$install_root/bin/dirule" validate --color never

      - name: Verify Cargo installation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "dirule-install"
          $projectRoot = Join-Path $env:RUNNER_TEMP "dirule-project"
          $dirule = Join-Path $installRoot "bin/dirule.exe"

          cargo install --path crates/dirule --locked --offline --root $installRoot
          New-Item -ItemType Directory -Force -Path $projectRoot | Out-Null
          Push-Location $projectRoot
          try {
            & $dirule init
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            & $dirule validate --color never
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
