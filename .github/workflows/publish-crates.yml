name: Publish crates

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - crates/**/Cargo.toml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - README.md
      - LICENSE*
      - .cargo/**
      - crates/**
      - .github/workflows/publish-crates.yml

permissions:
  contents: read

jobs:
  package:
    name: Check crate packages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo publish --workspace --dry-run --locked

  verify-release:
    name: Verify release (${{ matrix.os }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test --workspace --locked

  publish:
    name: Publish workspace to crates.io
    needs: verify-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify lockstep stable workspace versions
        run: |
          set -euo pipefail

          metadata="$(cargo metadata --no-deps --format-version 1)"
          version="$(jq -er '.packages[] | select(.name == "dirule") | .version' <<< "$metadata")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable workspace version, found '$version'." >&2
            exit 1
          fi
          jq -e --arg version "$version" \
            '(.packages | length > 0) and all(.packages[]; .version == $version)' \
            <<< "$metadata" > /dev/null
          echo "Publishing lockstep workspace version $version."

      - run: cargo publish --workspace --dry-run --locked

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish workspace crates
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
