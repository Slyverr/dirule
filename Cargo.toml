[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Slyverr/dirule"
homepage = "https://github.com/Slyverr/dirule"
readme = "README.md"
rust-version = "1.88"
version = "0.4.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
