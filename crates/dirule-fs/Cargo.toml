[package]
name = "dirule-fs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
dirule-core = { version = "0.1.0", path = "../dirule-core" }
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
ignore = "0.4"
renamore = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
