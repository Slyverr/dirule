[package]
name = "dirule-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
description = "Configuration, matching, transformation, and planning core for Dirule."
keywords = ["glob", "file-naming", "paths", "rule-engine", "transformation"]
categories = ["filesystem", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1.1"
unicode-segmentation = "1.13"
wax = { version = "0.7", default-features = false }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "core"
harness = false
