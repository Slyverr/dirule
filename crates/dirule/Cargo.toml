[package]
name = "dirule"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A local-first CLI for applying reusable rules to file and directory names."

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dirule-app = { version = "0.4.0", path = "../dirule-app" }
dirule-assistant = { version = "0.4.0", path = "../dirule-assistant" }
dirule-core = { version = "0.4.0", path = "../dirule-core" }
dirule-fs = { version = "0.4.0", path = "../dirule-fs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strip-ansi-escapes = "0.2.1"
termimad = { version = "0.35.5", default-features = false }
